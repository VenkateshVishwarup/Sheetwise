openapi: 3.0.3
info:
  title: Sheetwise API
  version: 1.0.0
  description: Private spreadsheet analytics. One shared internal workspace; all analytical
    database paths remain server-side. Schemas and examples are defined in components.
servers:
- url: http://127.0.0.1:8000
  description: Local development; use your HTTPS internal origin for deployment.
security:
- WorkspaceSession: []
paths:
  /api/status:
    get:
      operationId: getWorkspaceStatus
      summary: Read sign-in and AI configuration status.
      description: Read sign-in and AI configuration status. All records belong to
        the single authenticated internal workspace.
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStatus'
        '400':
          description: Bad Request — invalid fields, unsupported file or rejected
            query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — a valid workspace session is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — untrusted host or cross-origin write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found — dataset or answer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload Too Large — request or file exceeds its limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — import or analysis capacity is busy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Error — the request could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable — AI configuration, credits or provider
            availability prevents analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/session:
    post:
      operationId: createWorkspaceSession
      summary: Create an HttpOnly workspace session.
      description: Create an HttpOnly workspace session. All records belong to the
        single authenticated internal workspace.
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Strict session cookie; Secure when COOKIE_SECURE=true.
              schema:
                $ref: '#/components/schemas/Text'
              example: sheetwise_session=(signed session); HttpOnly; SameSite=Strict;
                Path=/
        '400':
          description: Bad Request — invalid fields, unsupported file or rejected
