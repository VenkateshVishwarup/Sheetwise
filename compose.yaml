services:
  sheetwise:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      WORKSPACE_PASSWORD: ${WORKSPACE_PASSWORD:?Set a workspace password in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - sheetwise-data:/app/data
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
volumes:
  sheetwise-data:
